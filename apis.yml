aid: sharebite
name: Sharebite
description: >-
  Sharebite, Inc. is a New York City-based corporate meal benefits platform,
  founded in 2016 by Dilip Rao and Mohsin Memon, that lets employers fund and
  administer employee food programs across office, hybrid, and fully remote
  workforces in the United States, Canada, and the United Kingdom. Its products
  are Sharebite Passport (a programmatic virtual meal card usable anywhere Visa
  or Mastercard is accepted, with per-employee budgets and geographic and
  time-of-day ordering rules), Sharebite Stations (curated group ordering for
  office teams), Corporate Catering, and Engage. Every meal ordered on the
  platform triggers a donated meal through Feeding America and City Harvest
  partnerships — more than 15 million meals to date. Sharebite publishes a
  SafeBase/Drata trust center naming SOC 2, PCI DSS, GDPR and CCPA posture, a
  public status page, and an llms.txt, but it operates no public developer
  portal: the enterprise integration surface it markets (including a partner
  integration with Envoy that syncs office attendance data) is reachable only
  through its contact-sales flow.
